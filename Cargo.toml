[package]
name = "elastic-glauth"
version = "1.0.0"
edition = "2024"
description = "Generates a glauthd configuration based on elasticsearch user database"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22"
dotenv = "0.15"
env_logger = "0.11"
hex = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
similar = "3"
tempfile = "3"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
